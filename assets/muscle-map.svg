    <rect x="28" y="-110" width="14" height="42" rx="4" fill="#ec4899" opacity="0.75"/>
    <!-- Abs -->
    <rect x="-28" y="-110" width="56" height="48" rx="6" fill="#a855f7" opacity="0.85"/>
    <!-- Quads -->
