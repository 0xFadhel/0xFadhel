  <text x="480" y="56" text-anchor="middle" fill="#484f58" font-family="Segoe UI, Arial, sans-serif" font-size="11">musclewiki.com</text>

  <!-- Divider -->
  <line x1="480" y1="72" x2="480" y2="558" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- View labels -->
