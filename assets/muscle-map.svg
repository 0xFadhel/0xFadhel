  <text x="720" y="84" text-anchor="middle" fill="#484f58" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">BACK</text>

  <!-- ===== FRONT VIEW ===== -->
  <g transform="translate(220, 320)">
    <!-- Base body (neutral) -->
    <rect x="-48" y="-161" width="96" height="100" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="-72" y="-148" width="20" height="55" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="52" y="-148" width="20" height="55" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="-70" y="-95" width="18" height="52" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="52" y="-95" width="18" height="52" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="-48" y="-62" width="96" height="22" rx="10" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="-42" y="-42" width="34" height="78" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="8" y="-42" width="34" height="78" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="-38" y="38" width="28" height="60" rx="10" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <rect x="10" y="38" width="28" height="60" rx="10" fill="#1c2128" stroke="#30363d" stroke-width="1"/>

    <!-- Muscle overlays -->
