    <ellipse cx="52" cy="-155" rx="16" ry="13" fill="#ef4444" opacity="0.85"/>
    <!-- Chest -->
    <rect x="-42" y="-161" width="84" height="48" rx="8" fill="#3b82f6" opacity="0.85"/>
    <!-- Biceps -->
    <rect x="-72" y="-148" width="20" height="50" rx="8" fill="#f59e0b" opacity="0.85"/>
    <rect x="52" y="-148" width="20" height="50" rx="8" fill="#f59e0b" opacity="0.85"/>
    <!-- Forearms -->
    <rect x="-70" y="-95" width="18" height="48" rx="6" fill="#84cc16" opacity="0.85"/>
    <rect x="52" y="-95" width="18" height="48" rx="6" fill="#84cc16" opacity="0.85"/>
    <!-- Obliques -->
