    <ellipse cx="-24" cy="105" rx="14" ry="7" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <ellipse cx="24" cy="105" rx="14" ry="7" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
